name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    name: Check the tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history includes origin/main, for the ancestor check.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tagged commit is on main
        run: |
          status=0
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || status=$?
          if [ "${status}" -eq 1 ]; then
            echo "error: tag ${GITHUB_REF_NAME} points to a commit that is not on main" >&2
          fi
          exit "${status}"
      - name: Compare the tag with the workspace version
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          version=$(jq --raw-output '.packages[] | select(.name == "sqlx-sqruff") | .version' <<<"${metadata}")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
      - name: Check that no crate version is on crates.io yet
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          mapfile -t crates < <(jq --raw-output '.packages[] | .name, .version' <<<"${metadata}")
          status=0
          .github/scripts/check-unpublished.sh "${crates[@]}" || status=$?
          if [ "${status}" -eq 1 ]; then
            echo "error: every crate needs a new version; to resume a release whose publish job failed, re-run only the failed jobs" >&2
          fi
          exit "${status}"

  publish:
    name: Publish to crates.io
    needs: [ci, check-version]
    runs-on: ubuntu-latest
    # Must match the environment configured for the trusted publisher on crates.io.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # The CLI depends on the library, so the library goes first. A crate whose
      # version is already on crates.io was published by an earlier attempt of
      # this job, so it is skipped and a re-run resumes with the next crate.
      - name: Publish sqlx-sqruff-core
        env:
          CRATE: sqlx-sqruff-core
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          version=$(jq --raw-output --arg name "${CRATE}" '.packages[] | select(.name == $name) | .version' <<<"${metadata}")
          status=0
          .github/scripts/check-unpublished.sh "${CRATE}" "${version}" || status=$?
          case "${status}" in
            0) cargo publish --locked --package "${CRATE}" ;;
            1) echo "Skipping ${CRATE} ${version}: an earlier attempt of this job published it." ;;
            *) exit "${status}" ;;
          esac
      - name: Publish sqlx-sqruff
        env:
          CRATE: sqlx-sqruff
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1 --locked)
          version=$(jq --raw-output --arg name "${CRATE}" '.packages[] | select(.name == $name) | .version' <<<"${metadata}")
          status=0
          .github/scripts/check-unpublished.sh "${CRATE}" "${version}" || status=$?
          case "${status}" in
            0) cargo publish --locked --package "${CRATE}" ;;
            1) echo "Skipping ${CRATE} ${version}: an earlier attempt of this job published it." ;;
            *) exit "${status}" ;;
          esac

  create-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # Refuse to release a tag whose commit is not on main.
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-binaries:
    name: Upload ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sqlx-sqruff
          target: ${{ matrix.target }}
          locked: true
          include: LICENSE-APACHE,LICENSE-MIT,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
