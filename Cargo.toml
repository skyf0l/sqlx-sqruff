[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skyf0l/sqlx-sqruff"
rust-version = "1.95"
readme = "README.md"
keywords = ["sqlx", "sql", "linter", "formatter", "sqruff"]

[workspace.dependencies]
sqlx-sqruff-core = { path = "crates/core", version = "1.0.0" }
# sqruff is 0.x and lightly documented, so isolate it behind the adapter module: a
# version/source change touches one file. Pinned exactly to the crates.io
# release so the workspace is publishable (a path/git dep would block publish).
sqruff-lib = "=0.44.0"
sqruff-lib-core = "=0.44.0"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
clap = { version = "4", features = ["derive"] }
# File discovery: gitignore-aware walking + include/exclude override globs in one
# crate (re-exports globset). Replaces a bare walkdir walk in the CLI.
ignore = "0.4"
anyhow = "1"
serde_json = "1"
